<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Clases con líderes de comunidad | Dropi Medellín</title>
  <meta name="description" content="Elige la clase de tu líder de comunidad e inscríbete en Luma. Inauguración de la regional Dropi Medellín.">
  <meta name="theme-color" content="#15112A">

  <!-- Vista previa al compartir por WhatsApp / redes.
       Cuando tengas la URL de GitHub Pages, cambia og:url y og:image por rutas absolutas. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Clases con líderes de comunidad | Dropi Medellín">
  <meta property="og:description" content="Elige tu clase e inscríbete en Luma.">
  <!-- <meta property="og:image" content="https://TU-USUARIO.github.io/TU-REPO/assets/og.jpg"> -->

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">

    <header class="head">
      <h1 class="title" id="title">Clases con líderes de comunidad</h1>
      <p class="subtitle" id="subtitle"></p>
      <p class="date" id="date" hidden></p>
    </header>

    <section class="wheel-area" aria-label="Líderes de comunidad">
      <div class="wheel" id="wheel">
        <div class="orbit" aria-hidden="true"></div>
        <div class="hub" id="hub" aria-hidden="true">
          <img class="hub-logo" id="hubLogo" alt="" hidden>
          <span class="hub-word" id="hubWord">dropi</span>
          <span class="hub-city" id="hubCity">Medellín</span>
          <span class="hub-count" id="hubCount"></span>
        </div>
        <div class="nodes" id="nodes"></div>
      </div>
    </section>

    <section class="panel" id="panel" aria-live="polite">
      <div class="panel-empty" id="panelEmpty">
        <p class="empty-lead">Elige un líder para ver su clase y apartar tu cupo en Luma.</p>
        <p class="empty-hint" id="emptyHint">Toca cualquier foto de la rueda. También puedes girarla deslizando el dedo.</p>
      </div>

      <article class="card" id="card" hidden>
        <div class="card-head">
          <span class="card-avatar-wrap" id="cardAvatarWrap"></span>
          <div class="card-who">
            <p class="card-name" id="cardName"></p>
            <p class="card-role" id="cardRole"></p>
          </div>
          <button class="card-close" id="cardClose" type="button" aria-label="Volver a ver todos los líderes">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>

        <h2 class="card-title" id="cardTitle"></h2>
        <p class="card-desc" id="cardDesc" hidden></p>
        <div class="chips" id="cardChips"></div>

        <a class="btn-primary" id="cardLink" target="_blank" rel="noopener">Inscribirme en Luma</a>

        <div class="card-nav">
          <button class="btn-ghost" id="prevBtn" type="button" aria-label="Líder anterior en la rueda">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn-ghost btn-share" id="shareBtn" type="button">Compartir esta clase</button>
          <button class="btn-ghost" id="nextBtn" type="button" aria-label="Líder siguiente en la rueda">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </article>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
